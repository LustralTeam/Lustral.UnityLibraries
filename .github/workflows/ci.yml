name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet run --project Packager.Tests -c Release
      - name: Plan (dry run against Unity's API, no releases)
        run: dotnet run --project Packager -c Release -- plan --limit 3
